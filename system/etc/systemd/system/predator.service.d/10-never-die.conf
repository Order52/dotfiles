[Unit]
# keep trying forever, whatever happened before
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=1
RestartPreventExitStatus=
# the userspace OOM killer (systemd-oomd) must never pick this service, and the kernel OOM killer already skips it (-1000)
ManagedOOMPreference=omit
OOMScoreAdjust=-1000
OOMPolicy=continue
# win the CPU even when a game or compile pins every core
Nice=-10
CPUWeight=1000
IOWeight=1000
# a stuck stop must not leave a half-dead service
TimeoutStopSec=5
TimeoutStartSec=30
# never throttled by a runaway child
TasksMax=64
LimitCORE=0
