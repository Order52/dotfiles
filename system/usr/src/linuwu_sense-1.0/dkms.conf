PACKAGE_NAME="linuwu_sense"
PACKAGE_VERSION="1.0"
BUILT_MODULE_NAME[0]="linuwu_sense"
BUILT_MODULE_LOCATION[0]="src/"
DEST_MODULE_LOCATION[0]="/kernel/drivers/platform/x86"
CLEAN="make clean"
AUTOINSTALL="yes"
MAKE[0]="if grep -q '^CONFIG_CC_IS_CLANG=y' /lib/modules/${kernelver}/build/.config; then make CC=clang LD=ld.lld KVER=${kernelver} all; else make KVER=${kernelver} all; fi"
