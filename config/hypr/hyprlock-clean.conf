general {
    no_fade_in = true
    no_fade_out = true
    hide_cursor = true
}

background {
    monitor =
    path = screenshot   # <--- This is the key fix!
    blur_passes = 0     # 0 means crystal clear (looks transparent)
    color = rgba(0,0,0,0)
}

input-field {
    monitor =
    size = 0, 0         # Invisible password box
    outline_thickness = 0
    dots_size = 0.0
    inner_color = rgba(0, 0, 0, 0)
    font_color = rgba(0, 0, 0, 0)
    fade_on_empty = false
    placeholder_text = 
}

label {
    monitor =
    # Optional: A tiny text to remind you the keyboard is locked
    text = LOCKED (Type password to unlock)
    color = rgba(200, 200, 200, 0.5)
    font_size = 20
    font_family = Noto Sans
    position = 0, 80
    halign = center
    valign = bottom
}
