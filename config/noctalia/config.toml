[accessibility]
ui_scale = 1.20

[bar.default]
center = [ "workspaces" ]
concave_edge_corners = false
background_opacity = 0.0       # fully transparent bar — only the widget pills are drawn
compositor_blur = false
shadow = false
border_width = 0.0
capsule = true                 # every widget gets its own pill (Waybar style)
capsule_fill = "on_secondary"
capsule_opacity = 1.0
end = [ "media", "spacer_1", "group:g3", "group:g2", "tray", "group:g4", "group:g5", "session" ]
margin_edge = 0
margin_ends = 10
radius_bottom_left = 12
radius_bottom_right = 12
radius_top_left = 0
radius_top_right = 0
scale = 1.10
start = [ "group:g0", "spacer_1", "group:g1" ]
thickness = 35

    [[bar.default.capsule_group]]
    border = ""
    fill = "on_secondary"
    id = "g1"
    members = [ "temp", "sysmon_2", "sysmon_3", "cpu_freq" ]
    opacity = 1.0
    padding = 6.0

    # launcher + clock + network speed (waybar: clock group)
    [[bar.default.capsule_group]]
    border = ""
    fill = "on_secondary"
    id = "g0"
    members = [ "launcher", "clock", "net_down", "net_up" ]
    opacity = 1.0
    padding = 6.0

    # notifications + privacy + battery + power (waybar: power group)
    [[bar.default.capsule_group]]
    border = ""
    fill = "on_secondary"
    id = "g4"
    members = [ "notifications", "privacy", "battery", "powermon" ]
    opacity = 1.0
    padding = 6.0

    # network + volume
    [[bar.default.capsule_group]]
    border = ""
    fill = "on_secondary"
    id = "g5"
    members = [ "network", "volume" ]
    opacity = 1.0
    padding = 6.0

    # Waybar "system" stats: CPU usage, GPU usage, disk
    [[bar.default.capsule_group]]
    border = ""
    fill = "on_secondary"
    id = "g3"
    members = [ "cpu_usage", "gpu_usage", "disk" ]
    opacity = 1.0
    padding = 6.0

    # Quick-action buttons: Predator profile, fan, refresh rate, gamemode, recorder
    [[bar.default.capsule_group]]
    border = ""
    fill = "on_secondary"
    id = "g2"
    members = [ "profile", "fan", "rgb", "refresh_rate", "gamemode", "recorder" ]
    opacity = 1.0
    padding = 6.0

[shell]
clipboard_image_action_command = "swash --stdin --name \"swash-$(date +'%Y-%m-%d_%H:%M:%S').png\""
launch_apps_as_systemd_services = true
polkit_agent = true    # Noctalia is the polkit agent now (replaces hyprpolkitagent)
settings_show_advanced = true

# Clipboard history (text + images: PNG/JPEG/JXL/AVIF/HEIC, encrypted at rest)
clipboard_enabled = true
clipboard_keep_from_closed_apps = true
clipboard_history_max_entries = 200
clipboard_auto_paste = "auto"          # images -> Ctrl+V, text -> Ctrl+Shift+V

    [shell.greeter_sync]
    auto_sync = false

    [shell.panel]
    control_center_placement = "floating"
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"

    [shell.screenshot]
    # built-in annotator + save to ~/Pictures/Screenshots + copy
    annotate = true
    save_to_file = true
    directory = "/home/sloppy/Pictures/Screenshots"
    filename_pattern = "screenshot-%Y%m%d_%H%M%S"
    copy_to_clipboard = true
    pipe_to_command = false

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[system.monitor]
gpu_poll_seconds = 2

[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "kcolorscheme", "kitty", "qt", "alacritty" ]

[widget.clock]
color = "secondary"
format = "{:%I:%M %p %A %m/%d/%y}"

[widget.launcher]
color = "secondary"

[widget.media]
hide_when_no_media = true
title_scroll = "on_hover"

[widget.network]
color = "secondary"
show_label = false

[widget.notifications]
color = "secondary"

[widget.session]
color = "error"

[widget.spacer_1]
type = "spacer"
capsule = false

[widget.temp]
show_value = false

[widget.sysmon_2]
glyph = "gpu-usage"
show_value = false
stat = "gpu_temp"
type = "sysmon"

[widget.sysmon_3]
glyph = "cpu-2"
stat = "ram_used"
type = "sysmon"

[widget.tray]
capsule = true
capsule_fill = "on_secondary"

[widget.volume]
color = "secondary"

[widget.workspaces]
active_pill_size = 2.5
capsule = true
capsule_fill = "on_primary"
inactive_pill_size = 1.0
pill_scale = 0.80
show_labels = false

# ══════════════════════════════════════════════════════════════════════════
#  Added from the old Waybar setup
# ══════════════════════════════════════════════════════════════════════════

# ── Network traffic (waybar: custom/network_traffic) ──
[widget.net_down]
type = "sysmon"
stat = "net_rx"
visualization = "none"
network_speed_compact = true

[widget.net_up]
type = "sysmon"
stat = "net_tx"
visualization = "none"
network_speed_compact = true

# ── CPU frequency / usage, GPU usage (waybar: cpufreq, cpu, nvidia) ──
[widget.cpu_freq]
type = "sysmon"
stat = "cpu_freq"
visualization = "none"

[widget.cpu_usage]
type = "sysmon"
stat = "cpu_usage"
visualization = "none"

[widget.cpu_usage.actions]
middle = "exec kitty -e btop"

[widget.gpu_usage]
type = "sysmon"
stat = "gpu_usage"
visualization = "none"

[widget.gpu_usage.actions]
middle = "exec kitty -e watch -n 1 nvidia-smi"

[widget.sysmon_3.actions]
middle = "exec kitty -e btop"

# ── Storage (waybar: custom/storage) ──
[widget.disk]
type = "sysmon"
stat = "disk_used_pct"
path = "/"
visualization = "none"

# ── Quick-action buttons (waybar: cpufreq / refresh-rate / gamemode / recorder) ──
[widget.profile]
type = "sloppy/toggles:profile"

[widget.profile.actions]
middle = "none"

[widget.rgb]
type = "sloppy/toggles:rgb"

[widget.rgb.actions]
middle = "none"

[widget.fan]
type = "sloppy/toggles:fan"

[widget.fan.actions]
middle = "none"   # frees the middle button so the plugin can set Auto

[widget.refresh_rate]
type = "sloppy/toggles:refresh"

[widget.refresh_rate.actions]
left = "exec ~/.config/waybar/modules/refresh-rate.sh toggle"

[widget.gamemode]
type = "sloppy/toggles:gamemode"

[widget.gamemode.actions]
left = "exec ~/.config/waybar/modules/gamemode.sh toggle"

[widget.recorder]
type = "sloppy/toggles:recorder"


# ── Audio visualizer (waybar: custom/cava) ──
# NOT on the bar: it forces a redraw every frame, ~23% of a CPU core while music plays (vs ~2% without).
# Add "audio_visualizer" to a bar section to use it anyway.
[widget.audio_visualizer]
type = "audio_visualizer"
width = 40
bands = 8
show_when_idle = false
color_1 = "primary"
color_2 = "secondary"

# ── Privacy dots (waybar: custom/privacy-dots) ──
[widget.privacy]
type = "privacy"
hide_inactive = true

# ── Battery (percentage) + live power/voltage plugin (waybar: battery + custom/electricity) ──
[widget.battery]
type = "battery"

[widget.powermon]
type = "sloppy/powermon:monitor"

# ── Extra click / scroll actions carried over from the Waybar modules ──
[widget.clock.actions]
middle = "exec gsimplecal"
back = "panel-toggle wallpaper"
forward = "exec ~/.config/hypr/scripts/screenshot_area"

[widget.media.actions]
middle = "media toggle"
scroll_up = "media next"
scroll_down = "media previous"

[widget.volume.actions]
middle = "volume-mute"
forward = "exec pavucontrol"

[widget.network.actions]
back = "exec ~/.config/hypr/scripts/copy-ip.sh v4"
forward = "exec ~/.config/hypr/scripts/copy-ip.sh v6"

# The whole transparent bar stays clickable: right-click anywhere in the gaps opens the
# Control Center dropdown (click_through is off so clicks never fall through to windows).
[bar.default.dead_zone]
click_through = false

[bar.default.dead_zone.actions]
right = "panel-toggle control-center"

# Super+Print / wallpaper-random also pick from subfolders of [wallpaper].directory
[wallpaper.automation]
recursive = true

# Alt+Tab: most-recently-used order, so the first Tab goes to the window you used last
[shell.window_switcher]
mru = true
