id          = "sloppy/toggles"
name        = "Quick Toggles"
version     = "1.0.0"
plugin_api  = 3
author      = "sloppy"
description = "Bar buttons with live state: refresh rate, gamemode, CPU governor, recorder, and the TrueSense fan, power mode and RGB controls."

[[widget]]
id    = "refresh"
entry = "refresh.luau"

[[widget]]
id    = "gamemode"
entry = "gamemode.luau"

[[widget]]
id    = "governor"
entry = "governor.luau"

[[widget]]
id    = "recorder"
entry = "recorder.luau"

[[widget]]
id    = "fan"
entry = "fan.luau"

[[panel]]
id     = "fan_panel"
entry  = "fan_panel.luau"
width  = 320
height = 230
placement       = "floating"
open_near_click = true

[[widget]]
id    = "profile"
entry = "profile.luau"

[[panel]]
id     = "profile_panel"
entry  = "profile_panel.luau"
width  = 340
height = 320
placement       = "floating"
open_near_click = true

[[widget]]
id    = "rgb"
entry = "rgb.luau"

[[panel]]
id     = "rgb_panel"
entry  = "rgb_panel.luau"
width  = 380
height = 800
placement       = "floating"
open_near_click = true

[[setting]]
key       = "show_profile"
type      = "bool"
default   = true
label_key = "settings.show_profile.label"

[[setting]]
key       = "show_fan"
type      = "bool"
default   = true
label_key = "settings.show_fan.label"

[[setting]]
key       = "show_rgb"
type      = "bool"
default   = true
label_key = "settings.show_rgb.label"

[[setting]]
key       = "show_refresh"
type      = "bool"
default   = true
label_key = "settings.show_refresh.label"

[[setting]]
key       = "show_gamemode"
type      = "bool"
default   = true
label_key = "settings.show_gamemode.label"

[[setting]]
key       = "show_recorder"
type      = "bool"
default   = true
label_key = "settings.show_recorder.label"
